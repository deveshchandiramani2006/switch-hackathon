company:
  name: "Demo Company"
  timezone: "Asia/Kolkata"
  locale: "en"
  industry: "SaaS"

tenant:
  id: "default"
  plan: "enterprise"

agents:
  sales_agent:   { enabled: true }
  support_agent: { enabled: true }
  geo_seo_agent: { enabled: true }
  blog_agent:    { enabled: true }
  infra_agent:   { enabled: true }
  cs_agent:      { enabled: true }
  finance_agent: { enabled: true }

llm:
  agents:
    default:
      provider: anthropic
      model: claude-sonnet-4-6
    sales_agent:
      provider: anthropic
      model: claude-sonnet-4-6
    support_agent:
      provider: anthropic
      model: claude-sonnet-4-6
    geo_seo_agent:
      provider: anthropic
      model: claude-sonnet-4-6
    blog_agent:
      provider: ollama
      model: mistral
    infra_agent:
      provider: ollama
      model: phi3
    cs_agent:
      provider: anthropic
      model: claude-sonnet-4-6
    finance_agent:
      provider: anthropic
      model: claude-sonnet-4-6
  formatter:
    fallback:
      provider: groq
      model: llama-3.3-70b-versatile

escalation_chains:
  sales:
    levels:
      - role: "sales_rep"
        slack_user: "@rep"
        wait_hours: 24
      - role: "team_lead"
        slack_user: "@lead"
        wait_hours: 24
      - role: "manager"
        slack_user: "@manager"
        wait_hours: 24
      - role: "founder"
        slack_user: "@founder"
        wait_hours: 48
    deal_size_tiers:
      high:   { min_value: 500000, interval_hours: 12 }
      medium: { min_value: 100000, interval_hours: 24 }
      low:    { min_value: 0,      interval_hours: 48 }
  support:
    levels:
      - role: "dev_on_duty"
        slack_user: "@oncall_dev"
        wait_minutes: 5
      - role: "engineering_lead"
        slack_user: "@eng_lead"
        wait_minutes: 15
      - role: "cto"
        slack_user: "@cto"
        wait_hours: 2
    sla:
      p0_hours: 2
      p1_hours: 8
      p2_hours: 48
  infra:
    levels:
      - role: "oncall"
        slack_user: "@oncall_infra"
        wait_minutes: 10
      - role: "engineering_lead"
        slack_user: "@eng_lead"
        wait_minutes: 20
    health_check_interval_minutes: 5
    failure_threshold: 2
  cs:
    csm: "@cs_team"
    cs_lead: "@cs_lead"
    alert_hours: 48
  finance:
    approver: "@finance_lead"
    timeout_hours: 48

geo_seo:
  analysis:
    trend_threshold_pct: 200
    rank_drop_threshold: 5
    content_gap_min_volume: 1000
    competitor_domains: []
  content_queue:
    max_briefs_per_run: 3
  country: "India"
  initial_keywords:
    - "AI invoicing tools India"
    - "payroll software startup"
    - "HR automation SaaS"

cs:
  health_score:
    nps_weight: 30
    support_weight: 25
    renewal_weight: 20
    engagement_weight: 25
  thresholds:
    green: 70
    yellow: 50
  renewal_alert_days: 30
  expansion_health_min: 80

finance:
  approval_required_above: 50000
  budget_alert_pct: 75
  invoice_reminder_days: 3

blog:
  approval:
    required_approvers: []
    timeout_hours: 48
  content_refresh_days: 90

integrations:
  crm: null
  billing: null
  helpdesk: null
  analytics: null
