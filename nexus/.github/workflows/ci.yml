name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m pytest tests/Unit/ -v

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent:
          - sales_agent
          - finance_agent
          - cs_agent
          - support_agent
          - geo_seo_agent
          - blog_agent
          - infra_agent

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.agent }} image
        run: |
          docker build \
            -f agents/${{ matrix.agent }}/Dockerfile \
            -t nexus-${{ matrix.agent }}:ci \
            .
