version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles: ["local-llm"]

  sales_agent:
    build:
      context: .
      dockerfile: agents/sales_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_SALES:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_SALES:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_SALES:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_SALES:-}
      AGENT_NAME: SalesAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  support_agent:
    build:
      context: .
      dockerfile: agents/support_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_SUPPORT:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_SUPPORT:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_SUPPORT:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_SUPPORT:-}
      AGENT_NAME: SupportAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  geo_seo_agent:
    build:
      context: .
      dockerfile: agents/geo_seo_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_GROWTH:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_GEOSEO:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_GEOSEO:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_GROWTH:-}
      AGENT_NAME: GeoSEOAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  blog_agent:
    build:
      context: .
      dockerfile: agents/blog_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_CONTENT:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_BLOG:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_BLOG:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_CONTENT:-}
      AGENT_NAME: BlogAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  infra_agent:
    build:
      context: .
      dockerfile: agents/infra_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_DEVOPS:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_INFRA:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_INFRA:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_DEVOPS:-}
      AGENT_NAME: InfraAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cs_agent:
    build:
      context: .
      dockerfile: agents/cs_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_CS:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_CS:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_CS:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_CS:-}
      AGENT_NAME: CSAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  finance_agent:
    build:
      context: .
      dockerfile: agents/finance_agent/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID_FINANCE:-}
      SWITCH_API_KEY: ${SWITCH_API_KEY_FINANCE:-}
      SWITCH_AGENT_ID: ${SWITCH_AGENT_ID_FINANCE:-}
      SWITCH_ROOM_ID: ${SWITCH_ROOM_ID_FINANCE:-}
      AGENT_NAME: FinanceAgent
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  voice_server:
    build:
      context: .
      dockerfile: docker/Dockerfile.voice
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      VOICE_SERVER_PORT: ${VOICE_SERVER_PORT:-5001}
    ports:
      - "${VOICE_SERVER_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  management_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.mgmt
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus_dev@postgres:5432/nexus
      NEXUS_MASTER_KEY: ${NEXUS_MASTER_KEY}
      MANAGEMENT_API_PORT: ${MANAGEMENT_API_PORT:-5000}
      NEXUS_CONFIG_DIR: /app/tenant_configs
    ports:
      - "${MANAGEMENT_API_PORT:-5000}:5000"
    volumes:
      - tenant_configs:/app/tenant_configs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  tenant_configs:
